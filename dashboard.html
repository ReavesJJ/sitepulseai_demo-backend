<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SitePulseAI Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#1E293B] text-gray-100">

<div class="p-6 max-w-5xl mx-auto">

  <h1 class="text-3xl font-bold text-[#0E4FAE] text-center mt-6 mb-4">
    SitePulseAI Infrastructure Visibility Console
  </h1>

  <!-- MAIN INPUT -->
  <div class="mt-6 p-4 bg-[#111827] rounded shadow border-2 border-[#2563EB]">
    <div class="flex flex-col sm:flex-row sm:items-center gap-2">
      <input id="website-url" type="text" placeholder="Enter website URL"
        class="flex-1 px-4 py-2 rounded border border-green-300 bg-[#E6FFFA] text-green-900 focus:ring-2 focus:ring-green-400 focus:outline-none" />

      <button onclick="generateTelemetryCertificate()"
        class="bg-green-400 hover:bg-green-300 text-white font-semibold px-4 py-2 rounded shadow transition">
        Generate Telemetry Certificate
      </button>

    </div>


     <!-- Certificate response appears here -->
  <div id="certificate-status" class="mt-4 text-sm text-yellow-400"></div>

  <div id="certificate-result" class="mt-4"></div>

</div>


  </div>


  <!-- ADDITIONAL URL -->
  <div class="mt-6 p-4 bg-[#111827] rounded shadow border-2 border-[#2563EB]">
    <div class="border border-[#2563EB] rounded-lg p-3 flex items-center justify-center gap-3">

      <input id="multi-url-input" type="text" placeholder="Enter additional URL"
        class="flex-1 ml-8 px-2 py-2 rounded border border-purple-400 bg-[#F3E8FF] text-purple-800 focus:ring-2 focus:ring-purple-500 focus:outline-none" />

      <button id="addButton"
        class="bg-purple-500 hover:bg-purple-400 text-white font-semibold px-4 py-2 rounded shadow transition">
        Add URL
      </button>

      <ul id="multi-url-list" class="pl-6 mt-4 space-y-1 text-gray-700 text-sm"></ul>
    </div>

    <div class="mt-6"></div>

    <!-- METRICS GRID -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

      <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB]">
        <h2 class="font-bold text-blue-400 shadow-blue-300 drop-shadow-lg">Uptime</h2>
        <p id="uptime" class="text-xl text-green-600 mt-2"></p>
      </div>

      <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB]">
        <h2 class="font-bold text-yellow-400 shadow-yellow-300 drop-shadow-lg">Response Time</h2>
        <p id="response-time" class="text-xl text-purple-600 mt-2"></p>
      </div>

      <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB]">
        <h2 class="font-bold text-pink-400 shadow-pink-300 drop-shadow-lg">SEO Status</h2>
        <p id="seo-score" class="text-xl text-blue-600 mt-2"></p>
      </div>

      <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB]">
        <h2 class="font-bold text-orange-400 shadow-orange-300 drop-shadow-lg">SSL Certificate</h2>
        <p id="ssl-status" class="text-xl text-red-600 mt-2"></p>

        <div id="ssl-managed"></div>
        <div id="ssl-renewed"></div>

        <button id="enable-assisted">Enable Assisted Renewal</button>
        <button id="approve-renewal">Approve Renewal</button>
        <button id="dry-run">Test Renewal (Dry Run)</button>

        <div id="dry-run-result"></div>

        <div id="ssl-renewal-flag" class="ssl-renewal-flag"></div>

        <button id="auto-fix-ssl-btn"
          onclick="triggerSSLAutoFix()"
          class="mt-2 bg-blue-500 hover:bg-blue-400 text-white px-3 py-1 rounded">
          Assisted SSL Workflow
        </button>

        <div id="ssl-auto-fix-output" class="text-sm mt-2 text-yellow-400"></div>
      </div>

      <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB]">
        <h2 class="font-bold text-red-400">Site Traffic</h2>
        <p id="traffic" class="text-xl text-purple-500 mt-2"></p>
      </div>

      <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB]">
        <h2 class="font-bold text-red-400">Vulnerabilities Detected</h2>
        <p id="vulnerabilities" class="text-xl text-purple-500 mt-2"></p>
      </div>

    </div>
  </div>

  <!-- AI SUMMARY -->
  <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB] mb-8">
    <h2 class="text-2xl font-bold text-green-400 shadow-green-300 drop-shadow-lg">
      AI Summary
    </h2>
    <p id="ai-summary" class="text-orange-700"></p>
  </div>

  <!-- AI RECOMMENDATIONS -->
  <div class="bg-[#111827] p-6 rounded shadow border-2 border-[#2563EB] mt-6">
    <h2 class="text-2xl font-bold mb-8 text-purple-600">AI Recommendations</h2>
    <div id="ai-recommendations" class="text-red-700 leading-relaxed space-y-2"></div>
  </div>

  <!-- SAVED SITES -->
  <div class="bg-[#111827] p-4 rounded shadow border-2 border-[#2563EB] mt-4 relative">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold text-orange-400 shadow-blue-300 drop-shadow-lg">
        Saved Sites
      </h2>

      
    </div>

    <ul id="saved-sites" class="list-none pl-0 mt-2 space-y-1 text-white-800 text-sm"></ul>
  </div>

  <div id="domains-table"></div>

</div>



<script>
// ---------------------------
// SitePulseAI Frontend Logic (Modular JS)
// ---------------------------

// ---------------------------
// GENERATE TELEMETRY CERTIFICATE
// ---------------------------

async function generateTelemetryCertificate() {

  const input = document.getElementById("website-url");
  const status = document.getElementById("certificate-status");
  const result = document.getElementById("certificate-result");

  if (!input || !status || !result) {
    console.error("Telemetry Certificate elements not found.");
    return;
  }

  const domain = input.value.trim();

  if (!domain) {
    status.textContent = "Enter a website URL first.";
    result.innerHTML = "";
    return;
  }

  status.textContent =
    `Generating Telemetry Certificate for ${domain}...`;

  result.innerHTML = "";

  try {

    const response = await fetch(
      `${API_BASE}/generate_telemetry_certificate`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          domain: domain
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.detail ||
        data.message ||
        "Certificate generation failed."
      );
    }

    status.textContent =
      "Telemetry Certificate generated successfully.";

    result.innerHTML = `
      <div class="mt-4 p-4 bg-[#0b1220] border border-green-400 rounded">

        <p class="text-green-400 font-semibold">
          Certificate Generated
        </p>

        <p class="text-gray-300 text-sm mt-2">
          Domain:
          <span class="text-white">
            ${data.domain || domain}
          </span>
        </p>

        <p class="text-gray-300 text-sm mt-2">
          Certificate ID:
          <span class="text-white">
            ${data.certificate_id || "--"}
          </span>
        </p>

        <p class="text-gray-300 text-sm mt-2 break-all">
          Certificate:
          <span class="text-white">
            ${data.certificate || "--"}
          </span>
        </p>

        <p class="text-gray-300 text-sm mt-2">
          Issued:
          <span class="text-white">
            ${data.timestamp || "--"}
          </span>
        </p>

      </div>
    `;

  } catch (err) {

    console.error(
      "Telemetry Certificate generation failed:",
      err
    );

    status.textContent =
      `Certificate generation failed: ${err.message}`;

  }
}




// ---------------------------
// SitePulseAI Frontend (AI-Agnostic Architecture)
// ---------------------------

const API_BASE = "https://sitepulseai-demo-backend.onrender.com";
const REFRESH_INTERVAL = 60000;

// ---------------------------
// DOM ELEMENTS
// ---------------------------
const addInput = document.getElementById("multi-url-input");
const addButton = document.getElementById("addButton");

const uptimeEl = document.getElementById("uptime");
const responseEl = document.getElementById("response-time");
const seoEl = document.getElementById("seo-score");
const sslEl = document.getElementById("ssl-status");
const trafficEl = document.getElementById("traffic");
const vulnEl = document.getElementById("vulnerabilities");

const aiSummaryEl = document.getElementById("ai-summary");

// ✅ NEW (Saved Sites container)
const savedSitesEl = document.getElementById("saved-sites");

// ---------------------------
// STATE
// ---------------------------
let segments = {};

// ---------------------------
// HELPERS
// ---------------------------
function normalizeDomain(domain) {
  if (!domain) return null;
  return domain.replace(/^https?:\/\//, "").replace(/\/$/, "").trim();
}

// ---------------------------
// TRAFFIC (SAFE)
// ---------------------------
async function fetchTraffic(domain) {
  try {
    const res = await fetch(`${API_BASE}/traffic/${domain}`);
    if (!res.ok) throw new Error();
    return await res.json();
  } catch (err) {
    console.error("Traffic fetch failed:", err);
    return { visitors_30d: 0, status: "Error" };
  }
}

// ---------------------------
// AI CONFIG (CLIENT CONTROLLED)
// ---------------------------
function getAIConfig() {
  try {
    return {
      key: localStorage.getItem("ai_api_key"),
      provider: localStorage.getItem("ai_provider") || "openai"
    };
  } catch {
    return { key: null, provider: "openai" };
  }
}

// ---------------------------
// LOAD SEGMENTS
// ---------------------------
async function loadDomains() {
  try {
    const res = await fetch(`${API_BASE}/segments`);
    const data = await res.json();
    segments = data.segments || {};
  } catch (err) {
    console.error("Segments load failed:", err);
    segments = {};
  }
}

// ---------------------------
// FETCH METRICS
// ---------------------------
async function fetchAllMetrics(domain) {
  try {
    const [
      uptime,
      latency,
      ssl,
      seo,
      vulnerabilitiesRaw,
      traffic
    ] = await Promise.all([
      fetch(`${API_BASE}/uptime/${domain}`).then(r => r.json()),
      fetch(`${API_BASE}/latency/${domain}`).then(r => r.json()),
      fetch(`${API_BASE}/ssl/${domain}`).then(r => r.json()),
      fetch(`${API_BASE}/seo/${domain}`).then(r => r.json()),
      fetch(`${API_BASE}/vulnerabilities/${domain}`).then(r => r.json()),
      fetchTraffic(domain)
    ]);

    return {
      domain,
      uptime,
      latency,
      ssl,
      seo,
      vulnerabilities: vulnerabilitiesRaw?.vulnerabilities,
      traffic
    };

  } catch (err) {
    console.error(`Metrics fetch failed for ${domain}:`, err);
    return null;
  }
}

// ---------------------------
// AI ANALYSIS
// ---------------------------
async function runAIAnalysis(resultsList) {
  const { key, provider } = getAIConfig();

  if (!key) {
    aiSummaryEl.innerHTML = "AI summary unavailable (not configured)";
    return;
  }

  try {
    aiSummaryEl.innerHTML = "Analyzing system state...";

    const response = await fetch(`${API_BASE}/ai/analyze`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-ai-provider": provider,
        "x-ai-key": key
      },
      body: JSON.stringify({ domains: resultsList })
    });

    if (!response.ok) throw new Error();

    const data = await response.json();

    aiSummaryEl.innerHTML = data.analysis
      ? data.analysis.replace(/\n/g, "<br>")
      : "No AI output";

  } catch (err) {
    console.error("AI error:", err);
    aiSummaryEl.innerHTML = "AI summary unavailable (not configured)";
  }
}

// ---------------------------
// RENDER GRID
// ---------------------------
function renderGrid(resultsList) {
  if (!resultsList || resultsList.length === 0) return;

  let uptimeHTML = "";
  let latencyHTML = "";
  let sslHTML = "";
  let seoHTML = "";
  let vulnHTML = "";
  let trafficHTML = "";

  resultsList.forEach(r => {
    if (!r) return;

    const domain = r.domain;

    uptimeHTML += `${domain} → ${r.uptime?.status || "Unknown"}<br>`;
    latencyHTML += `${domain} → ${r.latency?.response_time_ms ?? "--"} ms<br>`;

    const isValid = r.ssl?.valid;
    const days = r.ssl?.expires_in_days;
    const managed = r.ssl?.managed;

    if (typeof days === "number") {
      sslHTML += `${domain} → ${isValid ? "Valid" : "Invalid"} | Expires in ${days} days | Managed: ${managed ? "Yes" : "No"}<br>`;
    } else {
      sslHTML += `${domain} → SSL Unknown<br>`;
    }

    seoHTML += `${domain} → ${r.seo?.score ?? "--"}<br>`;
    vulnHTML += `${domain} → ${r.vulnerabilities?.total ?? 0}<br>`;
    trafficHTML += `${domain} → ${r.traffic?.visitors_30d ?? 0}<br>`;
  });

  uptimeEl.innerHTML = uptimeHTML;
  responseEl.innerHTML = latencyHTML;
  sslEl.innerHTML = sslHTML;
  seoEl.innerHTML = seoHTML;
  vulnEl.innerHTML = vulnHTML;
  trafficEl.innerHTML = trafficHTML;

  runAIAnalysis(resultsList);
}

// ---------------------------
// ✅ RENDER SAVED SITES (NEW)
// ---------------------------
function renderSavedSites() {
  if (!savedSitesEl) return;

  const allDomains = Object.values(segments).flat();

  if (allDomains.length === 0) {
    savedSitesEl.innerHTML = "No monitored domains";
    return;
  }

  savedSitesEl.innerHTML = "";

  allDomains.forEach(domain => {
    const row = document.createElement("div");
    row.className = "flex justify-between items-center mb-2";

    row.innerHTML = `
  <span>${domain}</span>
  <button
    class="bg-red-500 hover:bg-red-700 transition-colors duration-200 px-2 py-1 rounded"
    onclick="deleteDomain('${domain}')">
    Delete
  </button>
`;

    savedSitesEl.appendChild(row);
  });
}

// ---------------------------
// ✅ DELETE DOMAIN (NEW)
// ---------------------------
async function deleteDomain(domain) {
  try {
    await fetch(`${API_BASE}/delete_url`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ domain })
    });

    await loadDomains();
    monitoringLoop();
    renderSavedSites();

  } catch (err) {
    console.error("Delete failed:", err);
  }
}

// ---------------------------
// LOOP
// ---------------------------
async function monitoringLoop() {
  if (!segments || Object.keys(segments).length === 0) return;

  const allResults = [];

  for (const segment in segments) {
    const domains = segments[segment];
    const results = await Promise.all(domains.map(fetchAllMetrics));
    results.forEach(r => r && allResults.push(r));
  }

  renderGrid(allResults);
}

// ---------------------------
// ADD DOMAIN
// ---------------------------
async function addAdditionalURL() {
  const domain = normalizeDomain(addInput.value);

  if (!domain) {
    alert("Enter a valid domain");
    return;
  }

  try {
    await fetch(`${API_BASE}/add_url`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ domain, segment: "default" })
    });

    addInput.value = "";

    await loadDomains();
    monitoringLoop();
    renderSavedSites();

  } catch (err) {
    console.error("Add domain failed:", err);
  }
}

// ---------------------------
// INIT
// ---------------------------
async function init() {
  await loadDomains();
  monitoringLoop();
  renderSavedSites(); // ✅ integrated cleanly

  setInterval(monitoringLoop, REFRESH_INTERVAL);

  if (addButton) {
    addButton.addEventListener("click", addAdditionalURL);
  }
}

init();





</script>

</body>
</html>
